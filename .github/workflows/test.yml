name: Test Dashboard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v7

      # Cache node modules
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Cache dependencies
      - name: Cache node modules
        uses: actions/cache@v6
        id: npm-cache
        with:
          path: ./web/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Cache build output
      - name: Cache build output
        uses: actions/cache@v6
        id: build-cache
        with:
          path: ./web/dist
          key: build-${{ runner.os }}-${{ hashFiles('web/src/**/*', 'web/public/**/*') }}

      # Install dependencies if cache miss
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Quick, cheap check: run before the Playwright browser install and
      # build below so a broken backend link fails fast.
      - name: Verify run backends published
        run: node tests/run-backend-availability-test.js

      # Cache the Playwright browser download, keyed on the installed
      # Playwright version so a version bump fetches matching browsers.
      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      # Must run after npm ci (npx resolves playwright from node_modules).
      # Still runs on a cache hit, where it's a quick no-op if the cached
      # browsers match, so the cache can't go stale. System deps only need
      # installing alongside a fresh download; the runner image already has
      # what Chromium needs (it ships Google Chrome).
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify cached Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      - name: Setup token from secret
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          echo "// Mapbox token" > src/token.js
          echo "export const MAPBOX_TOKEN = '$MAPBOX_TOKEN';" >> src/token.js

      # Build site if cache miss
      - name: Build site
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Start server in background
        run: |
          PORT="${PORT:-3000}"
          echo "BASE_URL=http://localhost:$PORT" >> "$GITHUB_ENV"
          npx http-server dist -p "$PORT" --silent &
          echo $! > .server_pid
          sleep 3

      - name: Run tests
        run: node tests/dashboard-test.js

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: web/test-output/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f .server_pid ]; then
            kill $(cat .server_pid) || true
          fi
