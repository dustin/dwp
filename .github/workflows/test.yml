name: Test Dashboard

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./web

    steps:
      - uses: actions/checkout@v7

      # Cache node modules
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      # Cache dependencies
      - name: Cache node modules
        uses: actions/cache@v6
        id: npm-cache
        with:
          path: ./web/node_modules
          key: npm-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}

      # Cache build output
      - name: Cache build output
        uses: actions/cache@v6
        id: build-cache
        with:
          path: ./web/dist
          key: build-${{ runner.os }}-${{ hashFiles('web/src/**/*', 'web/public/**/*') }}

      # Install dependencies if cache miss
      - name: Install dependencies
        if: steps.npm-cache.outputs.cache-hit != 'true'
        run: npm ci

      # Install the browser binaries matching the lockfile-pinned Playwright.
      # Must run after npm ci (npx resolves playwright from node_modules);
      # unconditional, since a cache keyed only on the lockfile can't self-heal
      # if node_modules ever desyncs from the downloaded browsers.
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup token from secret
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          echo "// Mapbox token" > src/token.js
          echo "export const MAPBOX_TOKEN = '$MAPBOX_TOKEN';" >> src/token.js

      # Build site if cache miss
      - name: Build site
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: npm run build

      - name: Start server in background
        run: |
          PORT="${PORT:-3000}"
          echo "BASE_URL=http://localhost:$PORT" >> "$GITHUB_ENV"
          npx http-server dist -p "$PORT" --silent &
          echo $! > .server_pid
          sleep 3

      - name: Run tests
        run: node tests/dashboard-test.js

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: web/test-output/
          retention-days: 7

      - name: Stop server
        if: always()
        run: |
          if [ -f .server_pid ]; then
            kill $(cat .server_pid) || true
          fi
