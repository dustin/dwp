name: Build and Deploy
on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Node 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Setup token from secret
        env:
          MAPBOX_TOKEN: ${{ secrets.MAPBOX_TOKEN }}
        run: |
          for site in rider hub; do
            echo "// Mapbox token" > $site/token.js
            echo "export const MAPBOX_TOKEN = '$MAPBOX_TOKEN';" >> $site/token.js
          done
      - name: Build
        run: npm run build
      # nginx serves these with gzip_static/brotli_static instead of compressing each
      # request, and at the best level rather than its default of 1.
      - name: Precompress
        run: |
          find dist -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.csv' -o -name '*.json' -o -name '*.svg' \) -size +1k > precompress.txt
          xargs gzip -9 -k -f -n < precompress.txt
          node -e 'const fs = require("fs"), z = require("zlib");
            for (const f of fs.readFileSync("precompress.txt", "utf8").split("\n").filter(Boolean))
              fs.writeFileSync(f + ".br", z.brotliCompressSync(fs.readFileSync(f), {params: {[z.constants.BROTLI_PARAM_QUALITY]: 11}}));'
          rm precompress.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ./web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # One deploy at a time, so an older push can't finish last and rsync
    # its stale build over a newer one.
    concurrency:
      group: deploy
      cancel-in-progress: false
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: ./dist
      - name: Sync files to server
        run: |
          sudo apt-get update && sudo apt-get install -y rsync openssh-client
          mkdir -p ~/.ssh
          echo "${{ secrets.deploykey }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H aws1.sallings.org >> ~/.ssh/known_hosts
          # Two sites: the hub is downwind.pro, the rider site serves every
          # <rider>.downwind.pro.
          rsync -avz --delete --exclude token.js --filter 'protect .well-known/' ./dist/hub/ deploy@aws1.sallings.org:/var/www/dwp/
          rsync -avz --delete --exclude token.js --filter 'protect .well-known/' ./dist/rider/ deploy@aws1.sallings.org:/var/www/dwp-rider/
